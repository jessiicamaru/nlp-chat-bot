<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot tin tức tiếng Việt</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1a2233; --muted:#697586;
    --line:#e2e7ee; --accent:#2563eb; --accent-soft:#eff4ff;
    --bot:#f1f4f9; --ok:#0d9488; --warn:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1420; --panel:#161d2b; --ink:#e6ebf3; --muted:#94a3b8;
      --line:#26304240; --accent:#60a5fa; --accent-soft:#1e293b;
      --bot:#1c2534; --ok:#2dd4bf; --warn:#fbbf24;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header h1{margin:0; font-size:17px; font-weight:650}
  header .sub{color:var(--muted); font-size:12.5px}
  header .spacer{flex:1}
  .pill{
    font-size:12px; padding:3px 10px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--line);
  }
  button.ghost{
    font:inherit; font-size:13px; padding:5px 12px; cursor:pointer;
    background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:8px;
  }
  button.ghost:hover{color:var(--ink); border-color:var(--accent)}

  #log{flex:1; overflow-y:auto; padding:22px 20px; display:flex; flex-direction:column; gap:14px}
  .wrap{max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px}

  .msg{display:flex; gap:10px; align-items:flex-start}
  .msg.me{flex-direction:row-reverse}
  .avatar{
    width:30px; height:30px; border-radius:8px; flex:none;
    display:grid; place-items:center; font-size:14px;
    background:var(--bot); border:1px solid var(--line);
  }
  .msg.me .avatar{background:var(--accent); color:#fff; border-color:transparent}
  .bubble{
    padding:11px 14px; border-radius:12px; max-width:min(660px,82%);
    background:var(--panel); border:1px solid var(--line); white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .msg.me .bubble{background:var(--accent); color:#fff; border-color:transparent}
  .bubble strong{font-weight:650}
  .bubble em{color:var(--muted); font-style:normal; font-size:12.5px}
  .bubble a{color:var(--accent)}

  .meta{
    font-size:11.5px; color:var(--muted); margin-top:7px;
    padding-top:7px; border-top:1px dashed var(--line);
    display:flex; gap:12px; flex-wrap:wrap;
  }
  .meta b{font-weight:600; color:var(--ink)}
  .route-intent{color:var(--ok)} .route-retrieval{color:var(--accent)} .route-fallback{color:var(--warn)}

  .chips{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 4px}
  .chip{
    font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}

  footer{background:var(--panel); border-top:1px solid var(--line); padding:14px 20px}
  form{max-width:820px; margin:0 auto; display:flex; gap:10px}
  input[type=text]{
    flex:1; font:inherit; padding:11px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--accent); outline-offset:-1px}
  button.send{
    font:inherit; font-weight:600; padding:11px 20px; cursor:pointer;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
  }
  button.send:disabled{opacity:.5; cursor:default}
  .dots span{
    display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%;
    background:var(--muted); animation:b 1.2s infinite;
  }
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>

<header>
  <h1>Chatbot tin tức tiếng Việt</h1>
  <span class="sub">TF-IDF + Cosine Similarity + Naive Bayes — tự cài đặt</span>
  <span class="spacer"></span>
  <span class="pill" id="stats">đang nạp…</span>
  <button class="ghost" id="toggleMeta">Ẩn chi tiết</button>
  <button class="ghost" id="resetBtn">Hội thoại mới</button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <form id="form">
    <input type="text" id="input" placeholder="Hỏi mình về tin tức… ví dụ: tin về đảo Hải Nam"
           autocomplete="off" autofocus>
    <button class="send" id="send" type="submit">Gửi</button>
  </form>
</footer>

<script>
const wrap = document.getElementById('wrap');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const logEl = document.getElementById('log');
let sessionId = null;
let showMeta = true;

const SUGGESTIONS = [
  'có những chuyên mục nào',
  'tin về đảo Hải Nam',
  'giá iPhone 18 Pro',
  'tin sức khỏe về ăn chuối',
  'tóm tắt bài đó',
  'cho mình link'
];

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Bot trả về Markdown rất hạn chế: **đậm**, _nghiêng_, và URL trần.
function renderText(s){
  let h = escapeHtml(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/_\((.+?)\)_/g, '<em>($1)</em>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}

function addMessage(text, who, meta){
  const msg = document.createElement('div');
  msg.className = 'msg ' + (who === 'me' ? 'me' : 'bot');

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = who === 'me' ? 'B' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderText(text);

  if (meta && showMeta){
    const m = document.createElement('div');
    m.className = 'meta';
    const routeLabel = {intent:'intent', retrieval:'truy hồi', fallback:'không rõ'}[meta.route] || meta.route;
    m.innerHTML =
      `<span class="route-${meta.route}"><b>${routeLabel}</b></span>` +
      (meta.intent ? `<span>ý định: <b>${escapeHtml(meta.intent)}</b> (${meta.confidence.toFixed(2)})</span>` : '') +
      (meta.sources && meta.sources.length ? `<span>nguồn khớp: <b>${meta.sources.length}</b></span>` : '') +
      (meta.entities && meta.entities.category ? `<span>chuyên mục: <b>${escapeHtml(meta.entities.category)}</b></span>` : '');
    bubble.appendChild(m);
  }

  msg.appendChild(av);
  msg.appendChild(bubble);
  wrap.appendChild(msg);
  logEl.scrollTop = logEl.scrollHeight;
  return bubble;
}

function addSuggestions(){
  const box = document.createElement('div');
  box.className = 'chips';
  SUGGESTIONS.forEach(s => {
    const c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.textContent = s;
    c.onclick = () => { input.value = s; form.requestSubmit(); };
    box.appendChild(c);
  });
  wrap.appendChild(box);
}

function showTyping(){
  const msg = document.createElement('div');
  msg.className = 'msg bot'; msg.id = 'typing';
  msg.innerHTML = '<div class="avatar">AI</div>' +
    '<div class="bubble dots"><span></span><span></span><span></span></div>';
  wrap.appendChild(msg);
  logEl.scrollTop = logEl.scrollHeight;
}
function hideTyping(){ document.getElementById('typing')?.remove(); }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'me');
  input.value = '';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await res.json();
    hideTyping();
    if (data.error){ addMessage('Lỗi: ' + data.error, 'bot'); }
    else { sessionId = data.session_id; addMessage(data.reply, 'bot', data); }
  } catch (err) {
    hideTyping();
    addMessage('Không kết nối được tới server: ' + err.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

document.getElementById('toggleMeta').onclick = (e) => {
  showMeta = !showMeta;
  e.target.textContent = showMeta ? 'Ẩn chi tiết' : 'Hiện chi tiết';
  document.querySelectorAll('.meta').forEach(m => m.hidden = !showMeta);
};

document.getElementById('resetBtn').onclick = async () => {
  if (sessionId){
    await fetch('/reset', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:'', session_id: sessionId})
    });
  }
  sessionId = null;
  wrap.innerHTML = '';
  boot();
};

async function boot(){
  addMessage('Chào bạn! Mình là chatbot tin tức tiếng Việt.\nMình tìm câu trả lời trong kho bài báo VnExpress bằng TF-IDF và cosine similarity — không dùng mô hình ngôn ngữ lớn.\n\nThử một trong các câu dưới đây nhé:', 'bot');
  addSuggestions();
  try {
    const s = await (await fetch('/stats')).json();
    document.getElementById('stats').textContent =
      `${s.n_documents} bài · ${s.n_categories} chuyên mục · ${s.vocabulary_size.toLocaleString('vi-VN')} term`;
  } catch { document.getElementById('stats').textContent = 'không lấy được thống kê'; }
}
boot();
</script>
</body>
</html>
